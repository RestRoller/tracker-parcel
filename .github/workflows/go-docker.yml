name: Go Docker CI/CD

on:
  push:
    branches: [ main, master, newb ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master, newb ]

jobs:
  test:
    name: Test and Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Run vet
        run: go vet ./...

      - name: Run tests
        run: go test -v -cover ./...

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Файлы не отформатированы. Запустите 'gofmt -s -w .'"
            exit 1
          else
            echo "Все файлы отформатированы правильно"
          fi

      - name: Build application
        run: go build -v -o app ./...

      - name: Verify build
        run: |
          echo "Тесты пройдены успешно"
          echo "Сборка завершена"
          ls -la app

  publish:
    name: Publish to Docker Hub
    needs: test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/tracker-parcel
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Docker image
        run: |
          echo "Docker образ успешно опубликован!"
          echo "Образы:"
          echo "  - ${{ secrets.DOCKER_USERNAME }}/tracker-parcel:latest"
          echo "  - ${{ secrets.DOCKER_USERNAME }}/tracker-parcel:${{ steps.get_version.outputs.VERSION }}"
          
          # Проверка что образ можно скачать
          docker pull ${{ secrets.DOCKER_USERNAME }}/tracker-parcel:latest
          echo "Проверка образа завершена"
