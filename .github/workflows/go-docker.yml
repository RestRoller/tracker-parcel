name: Go Docker CI/CD with Publishing

on:
  push:
    branches: [ main, master, newb ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master, newb ]

jobs:
  test:
    name: Test Application
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
        # cache убран для избежания ошибки tar
    
    - name: Install dependencies (if any)
      run: |
        if [ -f go.mod ]; then
          go mod download
        else
          echo "No go.mod file found, skipping dependencies"
        fi
    
    - name: Run tests
      run: |
        if [ -f go.mod ]; then
          go test -v ./...
        else
          echo "No tests to run"
        fi
    
    - name: Build application
      run: go build -v -o app .
    
    - name: Verify build
      run: |
        if [ -f app ]; then
          echo "✅ Build successful: app created"
          ls -la app
        else
          echo "❌ Build failed: app not created"
          exit 1
        fi

  publish:
    name: 🚢 PUBLISH TO DOCKER HUB
    needs: test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Display tag information
      run: |
        echo "========================================="
        echo "🚀 PUBLISHING TAG: ${{ github.ref_name }}"
        echo "========================================="
        echo "📦 Repository: ${{ github.repository }}"
        echo "📌 Commit: ${{ github.sha }}"
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Login to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Verify Docker Hub login
      run: |
        echo "✅ Successfully logged in as: ${{ secrets.DOCKER_USERNAME }}"
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/tracker-parcel:latest
          ${{ secrets.DOCKER_USERNAME }}/tracker-parcel:${{ github.ref_name }}
        # Кэширование отключено для простоты
        no-cache: true
    
    - name: Verify push
      run: |
        echo "========================================="
        echo "✅✅✅ PUBLISH SUCCESSFUL ✅✅✅"
        echo "========================================="
        echo "📦 Images published:"
        echo "  - ${{ secrets.DOCKER_USERNAME }}/tracker-parcel:latest"
        echo "  - ${{ secrets.DOCKER_USERNAME }}/tracker-parcel:${{ github.ref_name }}"
        echo "========================================="
        echo "🔗 Docker Hub URL:"
        echo "  https://hub.docker.com/r/${{ secrets.DOCKER_USERNAME }}/tracker-parcel/tags"
    
    - name: Test pull image
      run: |
        echo "🔄 Testing image pull..."
        docker pull ${{ secrets.DOCKER_USERNAME }}/tracker-parcel:${{ github.ref_name }}
        if [ $? -eq 0 ]; then
          echo "✅ Image successfully pulled from Docker Hub"
          docker images | grep tracker-parcel
        else
          echo "❌ Failed to pull image"
          exit 1
        fi
