name: Go Docker CI/CD with Publishing

on:
  push:
    branches: [ main, master, newb ]
    tags: [ 'v*' ]  # ← запускается по тегам
  pull_request:
    branches: [ main, master, newb ]

jobs:
  test:
    name: Test Application
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Run tests
        run: go test -v ./...

      - name: Build
        run: go build -v -o app ./...

  publish:
    name: 🚢 PUBLISH TO DOCKER HUB
    needs: test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')  # ← запускается ТОЛЬКО по тегам

    steps:
      - uses: actions/checkout@v3

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/tracker-parcel:latest
            ${{ secrets.DOCKER_USERNAME }}/tracker-parcel:${{ github.ref_name }}
