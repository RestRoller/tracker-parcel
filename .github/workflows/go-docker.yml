name: Go Docker CI/CD

on:
  push:
    branches: [ main, newb ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, newb ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24.3'
      
      - name: Run tests
        run: go test -v ./...
      
      - name: Build
        run: go build -v -o app .

  publish:
    needs: test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v3
      
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/tracker-parcel:latest
            ${{ secrets.DOCKER_USERNAME }}/tracker-parcel:${{ github.ref_name }}
