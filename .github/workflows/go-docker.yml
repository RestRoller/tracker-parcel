name: Go Docker CI/CD with Publishing

on:
  push:
    branches: [ main, master, newb ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master, newb ]

jobs:
  test:
    name: Test Application
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
        cache: true
    
    - name: Run tests
      run: go test -v ./...
    
    - name: Build application
      run: go build -v -o app ./...
    
    - name: Test result
      run: echo "✅ Тесты пройдены успешно"

  publish:
    name: 🚢 PUBLISH TO DOCKER HUB
    needs: test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Display tag information
      run: |
        echo "========================================="
        echo "🚀 ЗАПУСК PUBLISH JOB ДЛЯ ТЕГА: ${{ github.ref_name }}"
        echo "========================================="
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Login to DockerHub
      id: login
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Verify Docker Hub login
      run: |
        if [ $? -eq 0 ]; then
          echo "✅ Успешный вход в Docker Hub как: ${{ secrets.DOCKER_USERNAME }}"
        else
          echo "❌ Ошибка входа в Docker Hub"
          exit 1
        fi
    
    - name: Build and push Docker image
      id: build
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/tracker-parcel:latest
          ${{ secrets.DOCKER_USERNAME }}/tracker-parcel:${{ github.ref_name }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Verify push success
      run: |
        echo "========================================="
        echo "✅✅✅ ПУБЛИКАЦИЯ УСПЕШНА ✅✅✅"
        echo "========================================="
        echo "📦 Образы опубликованы:"
        echo "  - ${{ secrets.DOCKER_USERNAME }}/tracker-parcel:latest"
        echo "  - ${{ secrets.DOCKER_USERNAME }}/tracker-parcel:${{ github.ref_name }}"
        echo "========================================="
        echo "🔗 Ссылка на Docker Hub:"
        echo "  https://hub.docker.com/r/${{ secrets.DOCKER_USERNAME }}/tracker-parcel/tags"
    
    - name: Test pull image
      run: |
        echo "🔄 Тестирование скачивания образа..."
        docker pull ${{ secrets.DOCKER_USERNAME }}/tracker-parcel:${{ github.ref_name }}
        if [ $? -eq 0 ]; then
          echo "✅ Образ успешно скачивается с Docker Hub"
          docker images | grep tracker-parcel
        else
          echo "❌ Ошибка скачивания образа"
          exit 1
        fi
    
    - name: Final success message
      run: |
        echo "══════════════════════════════════════════════"
        echo "     🎉 PUBLISH JOB ЗАВЕРШЕН УСПЕШНО 🎉     "
        echo "══════════════════════════════════════════════"
        echo "📌 Версия: ${{ github.ref_name }}"
        echo "📌 Репозиторий: ${{ secrets.DOCKER_USERNAME }}/tracker-parcel"
        echo "📌 Коммит: ${{ github.sha }}"
        echo "══════════════════════════════════════════════"
