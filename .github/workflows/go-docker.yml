name: Go Docker CI/CD with Publishing

on:
  push:
    branches: [ main, master, newb ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master, newb ]

jobs:
  test:
    name: Test Application
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
        # Убираем cache: true чтобы избежать ошибки
    
    - name: Install dependencies
      run: |
        go mod download || echo "No dependencies to download"
    
    - name: Run tests
      run: go test -v ./...
    
    - name: Build application
      run: go build -v -o app ./...
    
    - name: Test result
      run: echo "✅ Тесты пройдены успешно"

  publish:
    name: 🚢 PUBLISH TO DOCKER HUB
    needs: test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Display tag information
      run: |
        echo "========================================="
        echo "🚀 ЗАПУСК PUBLISH JOB ДЛЯ ТЕГА: ${{ github.ref_name }}"
        echo "========================================="
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Login to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Verify Docker Hub login
      run: |
        echo "✅ Успешный вход в Docker Hub как: ${{ secrets.DOCKER_USERNAME }}"
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/tracker-parcel:latest
          ${{ secrets.DOCKER_USERNAME }}/tracker-parcel:${{ github.ref_name }}
        # Убираем cache-from и cache-to для простоты
    
    - name: Verify push success
      run: |
        echo "========================================="
        echo "✅✅✅ ПУБЛИКАЦИЯ УСПЕШНА ✅✅✅"
        echo "========================================="
        echo "📦 Образы опубликованы:"
        echo "  - ${{ secrets.DOCKER_USERNAME }}/tracker-parcel:latest"
        echo "  - ${{ secrets.DOCKER_USERNAME }}/tracker-parcel:${{ github.ref_name }}"
    
    - name: Test pull image
      run: |
        echo "🔄 Тестирование скачивания образа..."
        docker pull ${{ secrets.DOCKER_USERNAME }}/tracker-parcel:${{ github.ref_name }}
        if [ $? -eq 0 ]; then
          echo "✅ Образ успешно скачивается с Docker Hub"
          docker images | grep tracker-parcel
        else
          echo "❌ Ошибка скачивания образа"
          exit 1
        fi
